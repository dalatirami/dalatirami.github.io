<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قارئ الكتب | Dalati English</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/icon/logo_dalati_english.svg">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #b85318;
      --accent-hover: #9c4312;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Cairo", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* منطقة القراءة */
    .viewer-wrap {
      width: 100%;
      min-height: 100vh;
      padding: 1.25rem 0.5rem calc(75px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* إصلاح العربية: الـ canvas يجب ألا يرث dir="rtl" من الصفحة */
    .page-slot, .page-slot canvas { direction: ltr; }

    .page-slot {
      position: relative;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page-slot canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* الشريط السفلي */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
      padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom, 0.5rem));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      height: 38px;
      padding: 0 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff !important;
      font-weight: 600;
    }

    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .page-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 0.4rem;
      direction: ltr;
      white-space: nowrap;
    }

    /* شاشات التحميل والخطأ */
    .status-box {
      margin: auto;
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      max-width: 440px;
      width: 90%;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    .spinner.small { width: 24px; height: 24px; margin: 0; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-title { color: #dc2626; font-size: 1.15rem; margin-bottom: 0.5rem; }
    .error-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.25rem; }

    @media (max-width: 600px) {
      .viewer-wrap { padding: 0.75rem 0.25rem calc(70px + env(safe-area-inset-bottom, 0px)); }
      .bottom-bar { padding: 0.35rem 0.45rem max(0.35rem, env(safe-area-inset-bottom, 0.35rem)); }
      .btn { height: 35px; padding: 0 0.5rem; font-size: 0.8rem; }
      .download-text { display: none; }
      .page-indicator { font-size: 0.78rem; padding: 0 0.15rem; }
    }
  </style>
</head>
<body>

  <main class="viewer-wrap" id="viewerWrap">
    <div class="status-box" id="loadingBox">
      <div class="spinner"></div>
      <p>جاري فتح الكتاب...</p>
    </div>

    <div class="status-box" id="errorBox" style="display: none;">
      <h2 class="error-title" id="errTitle">تعذر عرض الكتاب</h2>
      <p class="error-desc" id="errDesc">لم نتمكن من فتح ملف PDF المطلوب.</p>
      <a href="index.html" class="btn btn-primary">العودة إلى المقالات</a>
    </div>
  </main>

  <footer class="bottom-bar" id="bottomBar" style="display: none;">
    <div class="tool-group">
      <a href="index.html" id="backBtn" class="btn" aria-label="الرجوع إلى المقال">← العودة</a>
    </div>

    <div class="tool-group">
      <button id="zoomOutBtn" class="btn" type="button" aria-label="تصغير">-</button>
      <button id="fitWidthBtn" class="btn" type="button" aria-label="ملاءمة الشاشة">ملاءمة</button>
      <button id="zoomInBtn" class="btn" type="button" aria-label="تكبير">+</button>
    </div>

    <div class="tool-group">
      <span class="page-indicator"><span id="currentPageSpan">1</span> / <span id="totalPagesSpan">-</span></span>
    </div>

    <div class="tool-group">
      <a id="downloadBtn" href="#" class="btn btn-primary" aria-label="تنزيل ملف PDF">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="download-text">تحميل</span>
      </a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    (function () {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const viewerWrap = $('viewerWrap');
      const loadingBox = $('loadingBox');
      const errorBox = $('errorBox');
      const bottomBar = $('bottomBar');
      const currentPageSpan = $('currentPageSpan');
      const downloadBtn = $('downloadBtn');
      const backBtn = $('backBtn');

      function showError(title, desc) {
        loadingBox.style.display = 'none';
        errorBox.style.display = 'block';
        if (title) $('errTitle').textContent = title;
        $('errDesc').textContent = desc;
      }

      // 1. التحقق من اسم الملف
      function getSafeFile() {
        const raw = new URLSearchParams(window.location.search).get('file');
        if (!raw) return null;
        const clean = raw.trim();
        if (clean.includes('..') || clean.startsWith('/')) return null;
        if (!/^[a-zA-Z0-9_\-\/]+(\.pdf)?$/i.test(clean)) return null;
        return clean.toLowerCase().endsWith('.pdf') ? clean : clean + '.pdf';
      }

      const file = getSafeFile();
      if (!file) {
        showError('رابط غير صالح', 'يرجى فتح الكتاب من خلال رابط صحيح مثل ?file=001.pdf');
        return;
      }

      // 2. رابط التحميل
      const pdfUrl = 'booksread/' + file;
      downloadBtn.href = pdfUrl + '?download=1';
      downloadBtn.setAttribute('download', file.split('/').pop());

      // 3. زر العودة
      if (document.referrer && (document.referrer.includes('/english/') || document.referrer.includes('dalati.org'))) {
        backBtn.addEventListener('click', (e) => {
          e.preventDefault();
          history.back();
        });
      }

      // 4. Worker عبر Blob (لتجاوز قيود CORS)
      const pdfjsLib = window.pdfjsLib;
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob(
        ["importScripts('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');"],
        { type: 'application/javascript' }
      ));

      let pdfDoc = null;
      let zoomMode = 'fit-width';
      let currentZoom = 1.0;
      const pageSlots = [];
      const renderedPages = new Set();
      const renderTasks = new Map();   // رقم الصفحة -> { token, task } (وجودها = قيد الرسم)
      let tokenSeq = 0;

      // 5. رسم صفحة داخل الـ canvas الخاص بها
      function renderPageSlot(num, slot) {
        if (renderedPages.has(num) || renderTasks.has(num)) return;
        const token = ++tokenSeq;
        renderTasks.set(num, { token, task: null });
        const alive = () => renderTasks.get(num)?.token === token;

        pdfDoc.getPage(num).then(page => {
          if (!alive()) return;

          let scale = currentZoom;
          if (zoomMode === 'fit-width') {
            const availW = Math.min(viewerWrap.clientWidth - 16, 820);
            const unscaled = page.getViewport({ scale: 1.0 });
            scale = Math.min(Math.max(availW / unscaled.width, 0.4), 2.5);
          }

          const dpr = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale });

          slot.style.aspectRatio = `${viewport.width} / ${viewport.height}`;
          slot.style.maxWidth = Math.floor(viewport.width) + 'px';

          let canvas = slot.querySelector('canvas');
          if (!canvas) {
            canvas = document.createElement('canvas');
            slot.appendChild(canvas);
          }
          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);

          const ctx = canvas.getContext('2d');
          ctx.direction = 'ltr';

          const task = page.render({
            canvasContext: ctx,
            transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
            viewport
          });
          renderTasks.get(num).task = task;

          return task.promise.then(() => {
            if (!alive()) return;
            renderTasks.delete(num);
            renderedPages.add(num);
            const loader = slot.querySelector('.page-loader');
            if (loader) loader.style.display = 'none';
          });
        }).catch(err => {
          if (!alive()) return;
          renderTasks.delete(num);
          if (err && err.name !== 'RenderingCancelledException') {
            console.error(`Page ${num} render error:`, err);
          }
        });
      }

      // 6. تحميل الصفحات تدريجيًا أثناء التمرير + تحديث رقم الصفحة الحالية
      function setupObservers() {
        const loadObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              renderPageSlot(parseInt(entry.target.dataset.pageNumber, 10), entry.target);
            }
          });
        }, { rootMargin: '400px 0px', threshold: 0.01 });

        const spyObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) currentPageSpan.textContent = entry.target.dataset.pageNumber;
          });
        }, { rootMargin: '-35% 0px -35% 0px', threshold: 0 });

        pageSlots.forEach(slot => {
          loadObserver.observe(slot);
          spyObserver.observe(slot);
        });
      }

      // 7. إعادة رسم الصفحات الظاهرة عند التكبير أو تغيير الحجم
      function rerenderVisiblePages() {
        renderTasks.forEach(({ task }) => task && task.cancel());
        renderTasks.clear();
        renderedPages.clear();
        pageSlots.forEach(slot => {
          const rect = slot.getBoundingClientRect();
          if (rect.top < window.innerHeight + 500 && rect.bottom > -500) {
            renderPageSlot(parseInt(slot.dataset.pageNumber, 10), slot);
          }
        });
      }

      // 8. أزرار التكبير
      $('zoomInBtn').addEventListener('click', () => {
        zoomMode = 'custom';
        currentZoom = Math.min(Math.round((currentZoom + 0.2) * 10) / 10, 2.5);
        rerenderVisiblePages();
      });

      $('zoomOutBtn').addEventListener('click', () => {
        zoomMode = 'custom';
        currentZoom = Math.max(Math.round((currentZoom - 0.2) * 10) / 10, 0.5);
        rerenderVisiblePages();
      });

      $('fitWidthBtn').addEventListener('click', () => {
        zoomMode = 'fit-width';
        rerenderVisiblePages();
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        if (zoomMode !== 'fit-width') return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(rerenderVisiblePages, 200);
      });

      // 9. تحميل ملف PDF
      pdfjsLib.getDocument({
        url: pdfUrl,
        cMapUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: 'https://unpkg.com/pdfjs-dist@3.11.174/standard_fonts/',
        disableStream: true,
        disableAutoFetch: true
      }).promise.then(pdf => {
        pdfDoc = pdf;
        $('totalPagesSpan').textContent = pdf.numPages;

        return pdf.getPage(1).then(firstPage => {
          const base = firstPage.getViewport({ scale: 1.0 });

          for (let i = 1; i <= pdf.numPages; i++) {
            const slot = document.createElement('div');
            slot.className = 'page-slot';
            slot.dataset.pageNumber = i;
            slot.style.aspectRatio = `${base.width} / ${base.height}`;
            slot.innerHTML = '<div class="page-loader"><div class="spinner small"></div></div>';
            viewerWrap.appendChild(slot);
            pageSlots.push(slot);
          }

          loadingBox.style.display = 'none';
          bottomBar.style.display = 'flex';
          setupObservers();
        });
      }).catch(err => {
        showError(null, err && err.name === 'MissingPDFException'
          ? 'الملف المطلوب غير موجود في مكتبة الموقع (404).'
          : 'تعذر تحميل أو قراءة ملف الكتاب.');
      });
    })();
  </script>
</body>
</html>
